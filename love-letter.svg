<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Drop Shadow Filter -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Envelope Body -->
  <g filter="url(#shadow)">
    <!-- Main rectangle -->
    <rect x="20" y="60" width="160" height="100" rx="10" fill="#FFB5AB"/>
    
    <!-- Bottom triangle (fold) -->
    <path d="M20 160L100 110L180 160" stroke="#E39A7B" stroke-width="2" fill="none" opacity="0.5"/>
    
    <!-- Top Flap (Closed) -->
    <path d="M20 60L100 130L180 60V60H20V60Z" fill="#FFD3AC" stroke="#E39A7B" stroke-width="1"/>
    
    <!-- Wax Seal (Heart) -->
    <circle cx="100" cy="130" r="18" fill="#E35D6A"/>
    <path d="M100 138C100 138 92 134 92 128C92 125 94.5 123 97 123C98.5 123 99.5 124 100 125C100.5 124 101.5 123 103 123C105.5 123 108 125 108 128C108 134 100 138 100 138Z" fill="white"/>
  </g>
</svg>